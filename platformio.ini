; CheerLights BLE firmware: one build per ESP32 chip with Bluetooth LE.
; Each build starts with the first preset for its chip in lib/device/device.cpp,
; and the USB console changes it for any other board (docs/configure.md).

[platformio]
default_envs = esp32s3

[esp]
platform = espressif32@8.0.0
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    h2zero/NimBLE-Arduino@2.5.2
    adafruit/Adafruit NeoPixel@1.15.5
test_ignore = *
; 4 MB of flash in DIO mode works on every module these chips ship on.
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
extra_scripts = post:tools/merge_bin.py
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=0

; Chips with a built-in USB port: the console is on it and on UART0, so either cable works.
[usb_console]
build_flags =
    ${esp.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32]
extends = esp
board = esp32dev
build_flags = ${esp.build_flags} -DCL_CHIP=\"esp32\"

[env:esp32s3]
extends = esp
board = esp32-s3-devkitc-1
build_flags = ${usb_console.build_flags} -DCL_CHIP=\"esp32s3\"

[env:esp32c3]
extends = esp
board = esp32-c3-devkitm-1
build_flags = ${usb_console.build_flags} -DCL_CHIP=\"esp32c3\"

; The C5 and H2 build on pioarduino's platform, with the same Arduino-ESP32 3.3.12.
; On Windows its package needs long paths turned on (docs/building.md).
[pioarduino]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip

[env:esp32c5]
extends = esp
platform = ${pioarduino.platform}
board = esp32-c5-devkitc-1
build_flags = ${usb_console.build_flags} -DCL_CHIP=\"esp32c5\"

[env:esp32c6]
extends = esp
board = esp32-c6-devkitc-1
build_flags = ${usb_console.build_flags} -DCL_CHIP=\"esp32c6\"

[env:esp32h2]
extends = esp
platform = ${pioarduino.platform}
board = esp32-h2-devkitm-1
build_flags = ${usb_console.build_flags} -DCL_CHIP=\"esp32h2\"

; The wire formats, effects, settings, and console, tested on this computer with vectors from docs/ble-vectors.json.
[env:native]
platform = native
test_framework = unity
lib_deps = throwtheswitch/Unity@2.6.1
extra_scripts = pre:tools/gen_vectors.py
build_flags = -std=gnu++17 -Wall
